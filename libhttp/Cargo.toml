[package]
name = "libhttp"
version = "0.1.0"
edition = "2021"
description = "NeoDOS HTTP/1.1 client core (no_std, dependency-free)"

[lib]
name = "libhttp"
path = "src/lib.rs"
crate-type = ["lib"]

[dependencies]

[profile.release]
panic = "abort"
opt-level = 3
lto = true
debug = false

[profile.dev]
panic = "abort"
