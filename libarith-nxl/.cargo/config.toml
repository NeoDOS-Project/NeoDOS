[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=-Tarith.ld",
    "-C", "link-arg=-melf_x86_64",
    "-C", "link-arg=-no-pie",
    "-C", "link-arg=--unresolved-symbols=ignore-all",
    "-C", "link-arg=-shared",
    "-C", "link-arg=--export-dynamic",
    "-C", "relocation-model=pie",
]
