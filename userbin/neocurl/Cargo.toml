[package]
name = "neocurl"
version = "0.1.1"
edition = "2021"
description = "NeoDOS HTTP/1.1 client (neocurl)"

[[bin]]
name = "neocurl"
path = "src/main.rs"
test = false

[dependencies]
libneodos = { path = "../../libneodos" }
libnet = { path = "../../libnet" }
libhttp = { path = "../../libhttp" }
libclock = { path = "../../libclock", features = ["sys"] }

[profile.release]
panic = "abort"
opt-level = 3
lto = true
debug = false

[profile.dev]
panic = "abort"
