[package]
name = "neocfg"
version = "0.1.0"
edition = "2021"
description = "NeoCfg control panel — Ring 3 .NXE glue (CfgUi + CfgPlatform + Translator over libneocfg)"

[[bin]]
name = "neocfg"
path = "src/main.rs"
test = false

[dependencies]
libneodos = { path = "../../libneodos" }
libneocfg = { path = "../../libneocfg" }
libneotui = { path = "../../libneotui" }

[profile.release]
panic = "abort"
opt-level = 3
lto = true
debug = false

[profile.dev]
panic = "abort"
