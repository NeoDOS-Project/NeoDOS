[package]
name = "neotop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "neotop"
path = "src/main.rs"
test = false

[dependencies]
libneodos = { path = "../../libneodos" }
libmath = { path = "../../libmath" }
libneodiag = { path = "../../libneodiag" }

[profile.release]
panic = "abort"
opt-level = 3
lto = true
debug = false

[profile.dev]
panic = "abort"
