[package]
name = "libtls"
version = "0.2.0"
edition = "2021"
description = "Minimal TLS 1.3 client for NeoDOS"

[lib]
name = "libtls"
path = "src/lib.rs"
crate-type = ["lib"]
test = true

[features]
default = []
# Host debugging: print handshake probes to stderr.
debug-log = []

[dependencies]
libcrypto = { path = "../libcrypto" }
libclock = { path = "../libclock" }

[dev-dependencies]
x509-fixtures = { path = "../tools/x509-fixtures" }

[profile.release]
panic = "abort"
opt-level = 3
lto = true
debug = false
